<div class="home-container">
  <div class="home-card">

    <div class="logo">
      🤖
    </div>

    <h1>{{ title }}</h1>

    <p class="subtitle">
      Welcome to Angul-It.
      <br>
      Complete a series of interactive CAPTCHA challenges
      to prove that you are a human.
    </p>

    <div class="features">

      <span class="feature">🧮 Math Puzzle</span>
      <span class="feature">⌨ Text Verification</span>
    </div>

    <button (click)="startChallenge()">
      Start Challenge 🚀
    </button>

  </div>
</div>
